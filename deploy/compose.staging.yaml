# Staging overlay for this Rails SQLite stack. Uploaded as compose.override.yaml,
# which Docker Compose automatically merges with compose.yaml.
#
# The Rails base has no periodic backup service, so no service overrides are
# needed. Keep uploading this neutral file to replace stale overrides on retries.
# A command-only override for an absent service creates an invalid, imageless service.
#
# Staging isolation comes from its own Compose project and data volume, plus
# litestream.staging.yml copied as litestream.yml. Its replica stays inside that
# volume at /data/staging-replica instead of reaching production Spaces backups;
# the staging environment needs no Spaces credentials.
services: {}
